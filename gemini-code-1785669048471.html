<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 3반 학급 게시판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏫 2학년 3반 학급 게시판</h1>
        <p>우리 반의 공지사항과 일정을 한눈에 확인하세요!</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>📌 학급 공지사항</h2>
            <ul class="notice-list">
                
                <li class="notice-item" onclick="openModal('2학년 3반 환영합니다!', '2026-03-02', '2학년 3반 학급 게시판에 오신 것을 환영합니다!\n앞으로 주요 공지사항은 이곳에 업로드될 예정입니다.')">
                    <span>👋 2학년 3반 환영합니다!</span>
                    <span class="notice-badge">필독</span>
                </li>

                <li class="notice-item" onclick="openModal('3월 첫 주 준비물 안내', '2026-03-03', '1. 개인 수저통 및 물병\n2. 학급 실내화\n3. 제출 서류 (비상연락망 조사표)\n\n금요일까지 반드시 제출해 주세요!')">
                    <span>🎒 3월 첫 주 준비물 안내</span>
                    <span class="notice-badge">안내</span>
                </li>

                </ul>
        </div>

        <div class="card">
            <h2>⏰ 2학년 3반 시간표</h2>
            <table class="timetable">
                <thead>
                    <tr>
                        <th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>1</td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>2</td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>3</td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>4</td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>5</td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>6</td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td>7</td><td></td><td></td><td></td><td></td><td></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box">
            <div id="modalTitle" class="modal-header">제목</div>
            <div id="modalDate" class="modal-date">작성일: -</div>
            <div id="modalContent" class="modal-content">내용</div>
            <button class="close-btn" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
